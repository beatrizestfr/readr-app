spring.application.name=App-TFG
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/app_tfg
spring.datasource.username=root
spring.datasource.password=REDACTED_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
google.books.api.url=https://www.googleapis.com/books/v1/volumes
google.books.api.key=REDACTED_GOOGLE_BOOKS_API_KEY
# Mostrar las consultas SQL generadas por Hibernate
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.aop.proxy-target-class=false


# Niveles de log para Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.root=INFO
logging.level.com.tu.paquete=INFO

spring.web.resources.static-locations=file:uploads/
